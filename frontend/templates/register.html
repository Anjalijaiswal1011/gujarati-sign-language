{% extends 'base.html' %}

{% block title %}Register | SignTranslate{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; padding: 60px 20px;">
    <div class="card-pastel">
        <h2 class="section-title" style="margin-bottom: 20px;">Create Account</h2>
        <div id="register-message" class="status-message" style="display:none;"></div>
        
        <form id="register-form">
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="username" style="display:block; font-weight:600; margin-bottom: 8px;">Username</label>
                <input type="text" id="username" class="form-control" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;">
            </div>
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="email" style="display:block; font-weight:600; margin-bottom: 8px;">Email</label>
                <input type="email" id="email" class="form-control" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;">
            </div>
            
            <div class="form-group" style="margin-bottom: 30px;">
                <label for="password" style="display:block; font-weight:600; margin-bottom: 8px;">Password</label>
                <input type="password" id="password" class="form-control" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>
        
        <p class="text-center mt-4">Already have an account? <a href="{% url 'login-page' %}">Login here</a></p>
    </div>
</div>
{% csrf_token %}
{% endblock %}

{% block extra_scripts %}
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const msgDiv = document.getElementById('register-message');
        const submitBtn = e.target.querySelector('button[type="submit"]');
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';
        
        const payload = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/users/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            if (response.ok || response.status === 201) {
                msgDiv.textContent = "Registration successful! Redirecting to login...";
                msgDiv.style.background = "#d1fae5"; // Success green
                msgDiv.style.color = "#065f46";
                msgDiv.style.display = "block";
                
                setTimeout(() => {
                    window.location.href = "{% url 'login-page' %}";
                }, 2000);
            } else {
                msgDiv.textContent = "Registration failed. Try a different username.";
                msgDiv.style.background = "#fee2e2"; // Error red
                msgDiv.style.color = "#ef4444";
                msgDiv.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        } catch(err) {
            console.error(err);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Register';
        }
    });
</script>
{% endblock %}
